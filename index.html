<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Mamá</title>
<meta name="theme-color" content="#2b1231">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Para Mamá">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #2b1231;
    --bg2: #6d2a5a;
    --bg3: #e0788f;
    --papel: #fffaf5;
    --tinta: #4a2335;
    --rosa: #ff8fab;
    --sobre: #f6d3cb;
    --sobre-osc: #e9b4aa;
    --sello: #d7385e;
    --texto: #fff4f7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Quicksand", system-ui, sans-serif;
    color: var(--texto);
    background: radial-gradient(120% 90% at 50% 110%, var(--bg3) 0%, var(--bg2) 45%, var(--bg1) 100%) fixed;
    background-color: var(--bg1);
    overflow-x: hidden;
    user-select: none;
  }
  main {
    position: relative; z-index: 2;
    min-height: 100dvh;
    display: grid; place-items: center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    text-align: center;
  }
  .escena { display: flex; flex-direction: column; align-items: center; gap: 22px; width: 100%; max-width: 420px; }
  .escena[hidden] { display: none; }

  .kicker { font-size: 14px; letter-spacing: .25em; text-transform: uppercase; opacity: .75; }
  h1 { font-family: "Caveat", cursive; font-weight: 700; font-size: clamp(40px, 11vw, 56px); line-height: 1.02; }
  .pista { font-size: 14px; opacity: .7; animation: latido 2.4s ease-in-out infinite; }

  /* ---------- Sobre ---------- */
  .sobre {
    position: relative; width: 240px; height: 160px; margin-top: 18px;
    background: none; border: 0; cursor: pointer; perspective: 800px;
    animation: flotar 3.2s ease-in-out infinite;
  }
  .sobre .cuerpo {
    position: absolute; inset: 0; border-radius: 10px;
    background: linear-gradient(160deg, var(--sobre), var(--sobre-osc));
    box-shadow: 0 18px 40px rgba(0,0,0,.35);
    overflow: hidden;
  }
  .sobre .cuerpo::before, .sobre .cuerpo::after {
    content: ""; position: absolute; bottom: 0; width: 60%; height: 100%;
    background: var(--sobre);
  }
  .sobre .cuerpo::before { left: 0; clip-path: polygon(0 0, 100% 100%, 0 100%); filter: brightness(.97); }
  .sobre .cuerpo::after { right: 0; clip-path: polygon(100% 0, 100% 100%, 0 100%); filter: brightness(.93); }
  .sobre .solapa {
    position: absolute; top: 0; left: 0; right: 0; height: 58%; z-index: 3;
    background: linear-gradient(180deg, var(--sobre-osc), var(--sobre));
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transition: transform .6s cubic-bezier(.5,0,.3,1);
  }
  .sobre .sello {
    position: absolute; z-index: 4; left: 50%; top: 58%;
    width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ef6485, var(--sello));
    box-shadow: 0 4px 10px rgba(0,0,0,.3), inset 0 -3px 6px rgba(0,0,0,.2);
    display: grid; place-items: center; color: #fff; font-size: 24px;
    transition: transform .35s ease, opacity .35s ease;
  }
  .sobre.abierto { animation: none; }
  .sobre.abierto .sello { transform: scale(0) rotate(90deg); opacity: 0; }
  .sobre.abierto .solapa { transform: rotateX(180deg); z-index: 1; }
  .sobre.fuera { transition: transform .5s ease-in, opacity .5s ease-in; transform: translateY(40px) scale(.6); opacity: 0; }

  /* ---------- Polaroid ---------- */
  .polaroid {
    background: var(--papel); padding: 14px 14px 58px; border-radius: 4px;
    width: min(82vw, 330px);
    box-shadow: 0 24px 50px rgba(0,0,0,.4), 0 2px 0 rgba(255,255,255,.6) inset;
    transform: rotate(-3deg);
    position: relative;
  }
  .polaroid.entra { animation: caer 1.1s cubic-bezier(.2,.9,.3,1.15) both; }
  .polaroid::before {
    content: ""; position: absolute; top: -14px; left: 50%; width: 110px; height: 30px; margin-left: -55px;
    background: rgba(255, 220, 230, .75); transform: rotate(2deg);
    box-shadow: 0 1px 3px rgba(0,0,0,.15);
  }
  .polaroid img {
    display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover;
    background: #eee; border-radius: 2px;
  }
  .polaroid img.revela { animation: revelar 3.2s ease-out both; }
  .polaroid figcaption {
    position: absolute; left: 0; right: 0; bottom: 12px;
    font-family: "Caveat", cursive; font-weight: 700; font-size: 30px; color: var(--tinta);
  }

  .mensaje {
    font-family: "Caveat", cursive; font-size: clamp(26px, 7.4vw, 32px); line-height: 1.2;
    min-height: 2.6em; max-width: 360px; text-shadow: 0 2px 12px rgba(0,0,0,.25);
  }
  .mensaje .cursor { display: inline-block; width: 2px; height: .9em; background: currentColor; margin-left: 2px; vertical-align: -2px; animation: parpadeo .8s steps(1) infinite; }
  .firma { font-size: 15px; opacity: 0; transition: opacity 1s ease; }
  .firma.ver { opacity: .85; }

  .boton {
    font: 600 16px "Quicksand", sans-serif; color: var(--bg1);
    background: var(--texto); border: 0; border-radius: 999px;
    padding: 14px 26px; cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,.25);
    opacity: 0; transform: translateY(10px); transition: opacity .6s ease, transform .6s ease;
    pointer-events: none;
  }
  .boton.ver { opacity: 1; transform: none; pointer-events: auto; }
  .boton:active { transform: scale(.96); }

  /* ---------- Efectos ---------- */
  #fondo, #efectos { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  #fondo { z-index: 1; }
  #efectos { z-index: 5; }
  .corazon-fondo {
    position: absolute; bottom: -40px; color: var(--rosa); opacity: .0;
    animation: subir linear forwards;
  }
  .chispa {
    position: absolute; left: var(--x); top: var(--y); font-size: var(--s);
    animation: explotar 1.3s cubic-bezier(.1,.7,.3,1) forwards;
  }
  .huella {
    position: absolute; font-size: 22px; opacity: 0;
    animation: huella 2.4s ease forwards;
  }

  .sobre { width: 200px; height: 134px; margin-top: 4px; }
  .animos { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; }
  .animo {
    font: 600 16px "Quicksand", sans-serif; color: var(--texto); text-align: left;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.22);
    border-radius: 16px; padding: 13px 16px; cursor: pointer;
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: transform .15s ease, background .2s ease;
    opacity: 0; animation: aparecer .6s ease forwards;
  }
  .animo:nth-child(1) { animation-delay: .2s; } .animo:nth-child(2) { animation-delay: .35s; } .animo:nth-child(3) { animation-delay: .5s; }
  .animo:active { transform: scale(.97); background: rgba(255,255,255,.2); }
  .animo .emo { font-size: 24px; }
  .animo.destacado { background: rgba(255,143,171,.28); border-color: rgba(255,143,171,.6); }
  .volver { background: none; border: 0; color: var(--texto); opacity: .7; font: 14px "Quicksand", sans-serif; cursor: pointer; padding: 6px; }

  .respira { display: none; flex-direction: column; align-items: center; gap: 10px; }
  .respira.ver { display: flex; }
  .respira .bola {
    width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 28px;
    background: radial-gradient(circle, rgba(255,143,171,.55), rgba(255,143,171,0) 70%);
    animation: respirar 8s ease-in-out infinite;
  }
  .respira small { font-size: 14px; opacity: .8; }

  .sonido {
    position: fixed; z-index: 6; top: max(14px, env(safe-area-inset-top)); right: 14px;
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.12); color: var(--texto); font-size: 20px; cursor: pointer;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .sonido[hidden] { display: none; }
  @keyframes aparecer { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes respirar { 0%,100% { transform: scale(.8); } 50% { transform: scale(1.5); } }
  @keyframes flotar { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-10px) rotate(1deg); } }
  @keyframes latido { 0%,100% { opacity: .45; } 50% { opacity: .9; } }
  @keyframes parpadeo { 50% { opacity: 0; } }
  @keyframes caer {
    0% { transform: translateY(-110vh) rotate(-25deg); }
    100% { transform: translateY(0) rotate(-3deg); }
  }
  @keyframes revelar {
    0% { filter: brightness(2.6) contrast(.3) sepia(.7) blur(8px); }
    60% { filter: brightness(1.2) contrast(.85) sepia(.25) blur(1px); }
    100% { filter: none; }
  }
  @keyframes subir {
    0% { transform: translateY(0) translateX(0) rotate(0); opacity: 0; }
    10% { opacity: var(--o); }
    100% { transform: translateY(-115vh) translateX(var(--d)) rotate(var(--r)); opacity: 0; }
  }
  @keyframes explotar {
    0% { transform: translate(-50%, -50%) scale(.2); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(var(--r)); opacity: 0; }
  }
  @keyframes huella {
    0% { opacity: 0; transform: scale(.6) rotate(var(--r)); }
    20% { opacity: .9; transform: scale(1) rotate(var(--r)); }
    100% { opacity: 0; transform: scale(1) rotate(var(--r)); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<div id="fondo" aria-hidden="true"></div>

<main>
  <section class="escena" id="intro">
    <p class="kicker">De tus hijos, para ti</p>
    <h1>Ábrelo cada vez<br>que necesites<br>un abrazo</h1>
    <button class="sobre" id="sobre" aria-label="Abrir el sobre">
      <span class="cuerpo"></span>
      <span class="solapa"></span>
      <span class="sello">♥</span>
    </button>
    <div class="animos">
      <button class="animo destacado" data-animo="triste"><span class="emo">🥺</span>Presiona aquí si estás triste</button>
      <button class="animo" data-animo="extranas"><span class="emo">🫂</span>Si nos extrañas</button>
      <button class="animo" data-animo="sonreir"><span class="emo">☀️</span>Si solo quieres sonreír</button>
    </div>
  </section>

  <section class="escena" id="carta" hidden>
    <figure class="polaroid" id="polaroid">
      <img id="foto" alt="Foto juntos">
      <figcaption id="pie"></figcaption>
    </figure>
    <p class="mensaje" id="mensaje" aria-live="polite"></p>
    <p class="firma" id="firma"></p>
    <div class="respira" id="respira">
      <div class="bola">♥</div>
      <small id="respiraTexto">Respira conmigo… inhala</small>
    </div>
    <button class="boton" id="otro">Otro abrazo 🐾</button>
    <button class="volver" id="volver">← ¿cómo te sientes?</button>
  </section>
</main>

<div id="efectos" aria-hidden="true"></div>
<button class="sonido" id="sonido" aria-label="Silenciar música" hidden>🔊</button>
<audio id="musica" loop preload="auto"></audio>

<script>
/* ============================================================
   PERSONALIZA AQUÍ ✏️
   ============================================================ */
const CONFIG = {
  mama: "Mamá",
  perrita: "Princesa",
  firma: "Con todo nuestro amor, tus hijos 🐾",
  // Salen en este orden: primero una, luego la otra, y así sucesivamente.
  fotos: [
    { archivo: "fotos/mama-y-yo.jpg", pie: "Mi persona favorita ♥" },
    { archivo: "fotos/perrita.jpg", pie: "Princesa te espera ♥" },
  ],
  // Canción que suena al abrir (archivo .mp3 dentro de la carpeta "musica"). Déjalo en "" para no poner música.
  musica: "musica/cancion.mp3",
  volumen: 0.6,
  // Cumpleaños de mamá (MM-DD). Desde ese día y durante "diasCumple" días, lo primero que sale es un mensaje especial.
  cumple: "09-28",
  diasCumple: 7,
  mensajes: {
    triste: [
      "Mamá, no estás sola. Aquí estamos tus hijos, abrazándote fuerte aunque no nos veas.",
      "Llora si lo necesitas. Después respira hondo: todo va a estar bien, te lo prometemos.",
      "Eres la mujer más fuerte que conocemos. Y hasta los fuertes merecen un abrazo. Aquí va el nuestro.",
      "Si hoy pesa el día, recuerda que tienes dos corazones que laten por ti todo el tiempo.",
      "Cierra los ojos un momento: somos nosotros, dándote un abrazo y un lengüetazo 🐾",
      "{perrita} dice que te acuestes un ratico con ella, que así se pasa todo. Te amamos.",
      "Hasta en el rincón más oscuro del universo hay una estrella brillando. Hoy esa estrella somos nosotros, para ti.",
      "Aunque estemos del otro lado de la galaxia, si te sientes sola, busca la señal: aquí estamos, en cada latido tuyo.",
      "Ni un agujero negro podría tragarse lo mucho que te amamos. Respira, mamá. Todo va a estar bien.",
    ],
    extranas: [
      "Nosotros también te extrañamos, mamá. Muchísimo.",
      "Cada vez que abres esto, en algún lugar tus hijos están pensando en ti.",
      "La distancia es solo un número. Tú eres nuestro hogar.",
      "Cuenta los días que faltan para vernos. Nosotros ya los estamos contando.",
      "{perrita} te buscó por toda la casa hoy. Te extrañamos los dos.",
      "Como en Interstellar: el amor es lo único que atraviesa el tiempo y el espacio. Por eso el nuestro te llega, estés donde estés.",
      "Si cada hora lejos de ti valiera siete años, igual volveríamos. Siempre volvemos a casa.",
      "No importa cuántos años luz haya entre nosotros: tú eres nuestra gravedad, la que siempre nos trae de vuelta.",
      "Te mandamos este mensaje a través del tiempo y el espacio, como Cooper a Murph: te amamos, y vamos a volver.",
      "Mira el cielo esta noche. Esas estrellas están lejísimos y aun así las ves brillar. Así mismo te llega nuestro amor.",
    ],
    sonreir: [
      "Eres la mejor mamá del mundo. Tus hijos lo votamos por unanimidad (una votó con la pata 🐾).",
      "Guau guau. Traducción oficial: te amamos muchísimo, mamá.",
      "Tu sonrisa es nuestra cosa favorita del mundo. Regálanos una ahorita 🙂",
      "Gracias por todo lo que eres. Te amamos infinitamente.",
      "Dato curioso: tener la mejor mamá del mundo es lo más lindo que nos pasó.",
      "{perrita} manda a decir que le debes una galleta. Y un beso. Y otra galleta.",
      "Reporte de la misión: tus hijos te aman con la fuerza de un agujero negro. Fin de la transmisión 🚀",
      "{perrita}, copiloto oficial de la misión 'Volver a casa', reporta: todo en orden, solo falta tu abrazo 🐾",
    ],
  },
  mensajeCumple: "¡Feliz cumpleaños, {mama}! Hoy celebramos a la persona que más amamos en el mundo 🎂",
};
/* ============================================================ */

const $ = (id) => document.getElementById(id);
const disponibles = (lista) => lista.filter((m) => CONFIG.perrita || !m.includes("{perrita}"));
const rellenar = (t) => t.replaceAll("{perrita}", CONFIG.perrita).replaceAll("{mama}", CONFIG.mama);
const azar = (a, b) => a + Math.random() * (b - a);
const vibrar = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

// Si una foto no existe todavía, se muestra este marcador
const MARCADOR = "data:image/svg+xml;utf8," + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd6e0"/><stop offset="1" stop-color="#f7b2c4"/></linearGradient></defs>
    <rect width="400" height="500" fill="url(#g)"/>
    <text x="200" y="230" font-size="90" text-anchor="middle">🐶❤️🧑</text>
    <text x="200" y="310" font-family="sans-serif" font-size="22" fill="#6d2a5a" text-anchor="middle">Aquí va su foto juntos</text>
  </svg>`);

// Fondo: corazones que suben suavemente
const fondo = $("fondo");
function corazonDeFondo() {
  const c = document.createElement("span");
  c.className = "corazon-fondo";
  c.textContent = Math.random() < .85 ? "♥" : "🐾";
  c.style.left = azar(0, 100) + "vw";
  c.style.fontSize = azar(12, 30) + "px";
  c.style.setProperty("--o", azar(.25, .6).toFixed(2));
  c.style.setProperty("--d", azar(-60, 60) + "px");
  c.style.setProperty("--r", azar(-90, 90) + "deg");
  c.style.animationDuration = azar(9, 16) + "s";
  fondo.appendChild(c);
  c.addEventListener("animationend", () => c.remove());
}
for (let i = 0; i < 6; i++) setTimeout(corazonDeFondo, i * 500);
setInterval(corazonDeFondo, 900);

// Explosión de corazones desde un punto
const efectos = $("efectos");
function explosion(x, y, n = 28) {
  const simbolos = ["❤️", "💖", "💕", "🩷", "✨", "🐾"];
  for (let i = 0; i < n; i++) {
    const s = document.createElement("span");
    s.className = "chispa";
    s.textContent = simbolos[i % simbolos.length];
    const ang = (i / n) * Math.PI * 2 + azar(-.2, .2);
    const dist = azar(90, 220);
    s.style.setProperty("--x", x + "px");
    s.style.setProperty("--y", y + "px");
    s.style.setProperty("--s", azar(16, 30) + "px");
    s.style.setProperty("--dx", Math.cos(ang) * dist + "px");
    s.style.setProperty("--dy", Math.sin(ang) * dist + "px");
    s.style.setProperty("--r", azar(-180, 180) + "deg");
    efectos.appendChild(s);
    s.addEventListener("animationend", () => s.remove());
  }
}

// Huellitas que cruzan la pantalla
function huellitas() {
  const y0 = window.innerHeight - 70;
  for (let i = 0; i < 8; i++) {
    setTimeout(() => {
      const h = document.createElement("span");
      h.className = "huella";
      h.textContent = "🐾";
      h.style.left = (8 + i * 11) + "vw";
      h.style.top = (y0 + (i % 2 ? -14 : 8)) + "px";
      h.style.setProperty("--r", "80deg");
      efectos.appendChild(h);
      h.addEventListener("animationend", () => h.remove());
    }, i * 260);
  }
}

// Mensaje escrito letra por letra
let escribiendo = null;
function escribir(texto, alTerminar) {
  const el = $("mensaje");
  clearInterval(escribiendo);
  el.textContent = "";
  const cursor = document.createElement("span");
  cursor.className = "cursor";
  const nodo = document.createTextNode("");
  el.append(nodo, cursor);
  let i = 0;
  escribiendo = setInterval(() => {
    nodo.data = texto.slice(0, ++i);
    if (i >= texto.length) {
      clearInterval(escribiendo);
      setTimeout(() => { cursor.remove(); alTerminar && alTerminar(); }, 600);
    }
  }, 42);
}

// Elegir foto y mensaje sin repetir el anterior
let ultimo = { foto: -1, msj: -1 };
function elegir(lista, clave) {
  if (lista.length === 1) return 0;
  let i;
  do { i = Math.floor(Math.random() * lista.length); } while (i === ultimo[clave]);
  return (ultimo[clave] = i);
}
function esCumple() {
  if (!CONFIG.cumple) return false;
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const [mes, dia] = CONFIG.cumple.split("-").map(Number);
  const inicio = new Date(hoy.getFullYear(), mes - 1, dia);
  const dias = Math.round((hoy - inicio) / 86400000);
  return dias >= 0 && dias < (CONFIG.diasCumple || 1);
}

let animo = "sonreir";
let respiracion = null;

function respirar(activo) {
  clearInterval(respiracion);
  $("respira").classList.toggle("ver", activo);
  if (!activo) return;
  let inhala = true;
  $("respiraTexto").textContent = "Respira conmigo… inhala";
  respiracion = setInterval(() => {
    inhala = !inhala;
    $("respiraTexto").textContent = inhala ? "Respira conmigo… inhala" : "…y suelta despacito";
  }, 4000);
}

function mostrarCarta(primeraVez) {
  ultimo.foto = (ultimo.foto + 1) % CONFIG.fotos.length;
  const foto = CONFIG.fotos[ultimo.foto];
  const img = $("foto");
  const pol = $("polaroid");
  $("firma").classList.remove("ver");
  $("otro").classList.remove("ver");
  respirar(false);

  img.onerror = () => { img.onerror = null; img.src = MARCADOR; };
  img.src = foto.archivo;
  $("pie").textContent = rellenar(foto.pie || "Te amamos ♥");

  pol.classList.remove("entra"); img.classList.remove("revela");
  void pol.offsetWidth; // reinicia animaciones
  pol.classList.add("entra"); img.classList.add("revela");

  const lista = disponibles(CONFIG.mensajes[animo]);
  const texto = (primeraVez && esCumple())
    ? rellenar(CONFIG.mensajeCumple)
    : rellenar(lista[elegir(lista, "msj")]);

  setTimeout(() => {
    vibrar(20);
    escribir(texto, () => {
      $("firma").classList.add("ver");
      $("otro").classList.add("ver");
      if (animo === "triste") respirar(true);
      huellitas();
    });
  }, 1000);
}

// Música: arranca suavecito al primer toque
const audio = $("musica");
const botonSonido = $("sonido");
let musicaLista = false;
if (CONFIG.musica) {
  audio.src = CONFIG.musica;
  audio.addEventListener("canplaythrough", () => { musicaLista = true; }, { once: true });
}
function empezarMusica() {
  if (!CONFIG.musica || !audio.paused) return;
  audio.volume = 0;
  audio.play().then(() => {
    botonSonido.hidden = false;
    let v = 0;
    const subir = setInterval(() => {
      v = Math.min(CONFIG.volumen, v + 0.03);
      audio.volume = v;
      if (v >= CONFIG.volumen) clearInterval(subir);
    }, 120);
  }).catch(() => {});
}
botonSonido.addEventListener("click", () => {
  audio.muted = !audio.muted;
  botonSonido.textContent = audio.muted ? "🔇" : "🔊";
  botonSonido.setAttribute("aria-label", audio.muted ? "Activar música" : "Silenciar música");
});

// Abrir el sobre (tocando el sobre o uno de los botones)
const sobre = $("sobre");
function abrir(nuevoAnimo) {
  if (sobre.classList.contains("abierto")) return;
  animo = nuevoAnimo;
  ultimo.msj = -1;
  empezarMusica();
  vibrar([15, 40, 15]);
  sobre.classList.add("abierto");
  const r = sobre.getBoundingClientRect();
  setTimeout(() => explosion(r.left + r.width / 2, r.top + r.height / 2), 450);
  setTimeout(() => sobre.classList.add("fuera"), 650);
  setTimeout(() => {
    $("intro").hidden = true;
    $("carta").hidden = false;
    window.scrollTo(0, 0);
    mostrarCarta(true);
  }, 1150);
}
sobre.addEventListener("click", () => abrir(["triste", "extranas", "sonreir"][Math.floor(Math.random() * 3)]));
document.querySelectorAll("[data-animo]").forEach((b) => b.addEventListener("click", () => abrir(b.dataset.animo)));

$("otro").addEventListener("click", (e) => {
  vibrar(15);
  explosion(e.clientX, e.clientY, 16);
  mostrarCarta(false);
});

$("volver").addEventListener("click", () => {
  clearInterval(escribiendo);
  respirar(false);
  sobre.classList.remove("abierto", "fuera");
  $("carta").hidden = true;
  $("intro").hidden = false;
});

$("firma").textContent = rellenar(CONFIG.firma);

// Guarda todo en el celular para que funcione sin internet
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").then(() => {
    CONFIG.fotos.forEach((f) => { const i = new Image(); i.src = f.archivo; });
  });
}
</script>
